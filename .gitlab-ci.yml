image: docker:24.0.2

services:
  - name: docker:24-dind
    alias: docker

variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

stages:
  - build
  - diff
  - deploy
  - test

build-and-push:
  stage: build
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      echo "IMAGE_TAG (before_script)=$IMAGE_TAG"
    - apk add docker bash curl git
    - |
      ARCH="$(uname -m)"
      case "$ARCH" in
        aarch64|arm64)
          HELMFILE_ARCH="arm64"
          ;;
        x86_64|amd64)
          HELMFILE_ARCH="amd64"
          ;;
        *)
          echo "Unsupported architecture: $ARCH"
          exit 1
          ;;
      esac
    - curl -L "https://github.com/helmfile/helmfile/releases/download/v1.4.1/helmfile_1.4.1_linux_${HELMFILE_ARCH}.tar.gz" -o helmfile.tar.gz
    - tar -xzf helmfile.tar.gz
    - mv helmfile /usr/local/bin/
    - chmod +x /usr/local/bin/helmfile
    - helmfile -v
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "$HAWK_REGISTRY_PASSWORD" | docker login "$HAWK_REGISTRY" -u "$HAWK_REGISTRY_USER" --password-stdin
    - docker context create tls-context || true
    - docker context use tls-context
    - docker buildx create tls-context --name ci-builder --driver docker-container --use || true
    - docker buildx inspect --bootstrap
    - helmfile -e dev template
    - helmfile -e dev diff

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      echo "Image tag: $IMAGE_TAG"
    - docker buildx use ci-builder  
    - docker buildx build --builder ci-builder --platform linux/amd64,linux/arm64 --pull -t "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}" -t "${CI_REGISTRY_IMAGE}:latest" -t "${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG}" -t "${HAWK_REGISTRY_IMAGE}:latest" --push .
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "push"
      when: manual
    - when: never

diff-dev:
  stage: diff
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      export DEPLOY_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      export OWNER="${OWNER:-$CI_PROJECT_NAMESPACE}"
      echo "helmfile diff (env=dev) -> image=${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG} owner=${OWNER} ts=${DEPLOY_TIMESTAMP}"
    - helmfile -f helmfile.yaml.gotmpl -e dev -l env=dev diff

diff-prod:
  stage: diff
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      export DEPLOY_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      export OWNER="${OWNER:-$CI_PROJECT_NAMESPACE}"
      echo "helmfile diff (env=prod) -> image=${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG} owner=${OWNER} ts=${DEPLOY_TIMESTAMP}"
    - helmfile -f helmfile.yaml.gotmpl -e prod -l env=prod diff

deploy-dev:
  stage: deploy
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest
  when: manual
  allow_failure: false
  environment:
    name: dev
  before_script:
    - |
      if [ -z "$KUBECONFIG" ] || [ ! -f "$KUBECONFIG" ]; then
        echo "ERROR: KUBECONFIG file variable is not set or file not found. Add CI variable KUBECONFIG (File) with kubeconfig for the 'ci' ServiceAccount."
        exit 1
      fi
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      export DEPLOY_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      export OWNER="${OWNER:-$CI_PROJECT_NAMESPACE}"
      echo "Deploying env=dev image=${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG} owner=${OWNER} ts=${DEPLOY_TIMESTAMP}"
    - kubectl delete ciliumnetworkpolicy app-dev-hawk-chart -n iv222 --ignore-not-found=true --wait=true
    - kubectl get ciliumnetworkpolicy -n iv222 || true
    - helmfile -f helmfile.yaml.gotmpl -e dev -l env=dev template | grep -n "namespaceSelector" && exit 1 || true
    - kubectl delete vpa app-dev-hawk-chart -n iv222 --ignore-not-found=true
    - helmfile -f helmfile.yaml.gotmpl -e dev -l env=dev apply

deploy-prod:
  stage: deploy
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest
  when: manual
  allow_failure: false
  environment:
    name: prod
  before_script:
    - |
      if [ -z "$KUBECONFIG" ] || [ ! -f "$KUBECONFIG" ]; then
        echo "ERROR: KUBECONFIG file variable is not set or file not found. Add CI variable KUBECONFIG (File) with kubeconfig for the 'ci' ServiceAccount."
        exit 1
      fi
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      export DEPLOY_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      export OWNER="${OWNER:-$CI_PROJECT_NAMESPACE}"
      echo "Deploying env=prod image=${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG} owner=${OWNER} ts=${DEPLOY_TIMESTAMP}"
    - kubectl delete ciliumnetworkpolicy app-prod-hawk-chart -n iv222 --ignore-not-found=true
    - kubectl delete vpa app-prod-hawk-chart -n iv222 --ignore-not-found=true
    - helmfile -f helmfile.yaml.gotmpl -e prod -l env=prod apply

test-ci:
  stage: test
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest

  before_script:
    - apk add docker

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then export IMAGE_TAG="$CI_COMMIT_TAG"; fi
      if [ -n "$CI_COMMIT_SHORT_SHA" ]; then export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"; fi
      if [ -z "$IMAGE_TAG" ]; then export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"; fi
      echo "IMAGE_TAG=$IMAGE_TAG"
      echo "$HAWK_REGISTRY_PASSWORD" | docker login "$HAWK_REGISTRY" -u "$HAWK_REGISTRY_USER" --password-stdin
      docker manifest inspect "${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG}" > /dev/null
      helmfile -f helmfile.yaml.gotmpl -e dev -l env=dev diff
      helmfile -f helmfile.yaml.gotmpl -e prod -l env=prod diff
      helmfile -f helmfile.yaml.gotmpl -e dev -l env=dev template > dev.yaml
      helmfile -f helmfile.yaml.gotmpl -e prod -l env=prod template > prod.yaml
    - |
      kubectl delete role ci-pod-access -n iv222 --ignore-not-found=true || true
      kubectl delete rolebinding ci-pod-access-binding -n iv222 --ignore-not-found=true || true
      kubectl delete role ci-pod-access-manual -n iv222 --ignore-not-found=true || true
      kubectl delete rolebinding ci-pod-access-manual-binding -n iv222 --ignore-not-found=true || true
      kubectl apply -f k8s/rbac.yaml
    - |
      echo "===== DEBUG: pods in namespace ====="
      kubectl get pod -n iv222 -o wide || true

      echo "===== DEBUG: RBAC check ====="
      kubectl auth can-i list pods -n iv222 || true
      kubectl auth can-i create pods/portforward -n iv222 || true

      echo "===== DEBUG: pick app-dev pod ====="
      POD="$(kubectl get pod -n iv222 -l app.kubernetes.io/instance=app-dev -o jsonpath='{.items[0].metadata.name}')"
      echo "POD=$POD"

      echo "===== DEBUG: describe pod ====="
      kubectl describe pod -n iv222 "$POD" || true

      echo "===== DEBUG: previous logs ====="
      kubectl logs -n iv222 "$POD" --previous || true

      echo "===== DEBUG: current logs ====="
      kubectl logs -n iv222 "$POD" || true

      echo "===== DEBUG: serviceaccount files ====="
      kubectl exec -n iv222 "$POD" -- sh -c 'ls -la /var/run/secrets/kubernetes.io/serviceaccount/ || true' || true

      echo "===== DEBUG: k8s env inside pod ====="
      kubectl exec -n iv222 "$POD" -- sh -c 'env | grep KUBERNETES || true' || true

      echo "===== DEBUG: endpoint ====="
      kubectl get svc -n iv222
      kubectl get endpoints -n iv222

    - kubectl get ingress -n iv222

    - |
      grep -q "kind: ServiceAccount" dev.yaml || { echo "ServiceAccount отсутствует"; exit 1; }
      grep -q "kind: RoleBinding" dev.yaml || { echo "RoleBinding отсутствует"; exit 1; }
      grep -q "ServiceAccount" dev.yaml || { echo "RoleBinding не содержит ServiceAccount"; exit 1; }
      grep -q "kind: Middleware" dev.yaml || { echo "Middleware отсутствует"; exit 1; }
      grep -q "kind: VerticalPodAutoscaler" dev.yaml || { echo "VPA отсутствует"; exit 1; }
      grep -q 'updateMode: "Off"' dev.yaml || { echo "VPA должен быть в режиме Off"; exit 1; }
      echo "===== DEBUG: VPA ====="
      kubectl get vpa -n iv222 app-dev-hawk-chart -o yaml || true
      VPA_MODE=""
      CPU_TARGET=""
      MEM_TARGET=""
      for i in $(seq 1 60); do
        VPA_MODE="$(kubectl get vpa -n iv222 app-dev-hawk-chart -o jsonpath='{.spec.updatePolicy.updateMode}' 2>/dev/null || true)"
        CPU_TARGET="$(kubectl get vpa -n iv222 app-dev-hawk-chart -o jsonpath='{.status.recommendation.containerRecommendations[0].target.cpu}' 2>/dev/null || true)"
        MEM_TARGET="$(kubectl get vpa -n iv222 app-dev-hawk-chart -o jsonpath='{.status.recommendation.containerRecommendations[0].target.memory}' 2>/dev/null || true)"
        if [ "$VPA_MODE" = "Off" ] && [ -n "$CPU_TARGET" ] && [ -n "$MEM_TARGET" ]; then
          echo "VPA recommendation ready: cpu=$CPU_TARGET memory=$MEM_TARGET"
          break
        fi
        sleep 5
      done
      [ "$VPA_MODE" = "Off" ] || { echo "VPA mode is not Off: $VPA_MODE"; exit 1; }
      [ -n "$CPU_TARGET" ] || { echo "VPA recommendation cpu is empty"; exit 1; }
      [ -n "$MEM_TARGET" ] || { echo "VPA recommendation memory is empty"; exit 1; }
      kubectl get pod -n iv222
      set -euo pipefail
      kubectl port-forward -n iv222 svc/app-dev-hawk-chart 8080:8080 &
      PORT_FORWARD_PID=$!
      cleanup() {
        kill "$PORT_FORWARD_PID" 2>/dev/null || true
        wait "$PORT_FORWARD_PID" 2>/dev/null || true
      }
      trap cleanup EXIT
      for i in $(seq 1 30); do
        if curl -fsS --max-time 2 http://127.0.0.1:8080/health >/dev/null; then
          echo "Port-forward is ready"
          break
        fi
        sleep 1
      done
      echo "===== DEBUG: log ====="
      kubectl logs -n iv222 deploy/app-dev-hawk-chart
      curl localhost:8080
      curl -vk https://iv222s03-dev.hawk-dev.csc.sibsutis.ru/
      RESPONSE=$(curl -fsS --max-time 20 http://127.0.0.1:8080/)
      echo "$RESPONSE"
      echo "$RESPONSE" | grep -q '"pod_count":' || { echo "Root endpoint вернул неожиданный ответ"; exit 1; }
      RESPONSE_PARTNER=$(curl -fsS --max-time 30 http://127.0.0.1:8080/partner)
      echo "Partner response: $RESPONSE_PARTNER"
      echo "$RESPONSE_PARTNER" | grep -q '"external_app"' || { echo "Partner endpoint вернул неожиданный ответ"; exit 1; }
