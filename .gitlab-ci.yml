image: docker:24.0.2

services:
  - name: docker:24-dind
    alias: docker

variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

stages:
  - build
  - diff
  - deploy
  - test

build-and-push:
  stage: build
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest
  before_script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      echo "IMAGE_TAG (before_script)=$IMAGE_TAG"
    - apk add docker bash curl git
    - curl -L https://github.com/helmfile/helmfile/releases/download/v1.4.1/helmfile_1.4.1_linux_amd64.tar.gz -o helmfile_1.4.1_linux_amd64.tar.gz
    - tar -xzf helmfile_1.4.1_linux_amd64.tar.gz
    - mv helmfile /usr/local/bin/
    - chmod +x /usr/local/bin/helmfile
    - helmfile -v
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - echo "$HAWK_REGISTRY_PASSWORD" | docker login "$HAWK_REGISTRY" -u "$HAWK_REGISTRY_USER" --password-stdin
    - docker context create tls-context || true
    - docker context use tls-context
    - docker buildx create tls-context --name ci-builder --driver docker-container --use || true
    - docker buildx inspect --bootstrap
    - helmfile -e dev template
    - helmfile -e dev diff

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      echo "Image tag: $IMAGE_TAG"
    - docker buildx use ci-builder  
    - docker buildx build --builder ci-builder --platform linux/amd64,linux/arm64 --pull -t "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}" -t "${CI_REGISTRY_IMAGE}:latest" -t "${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG}" -t "${HAWK_REGISTRY_IMAGE}:latest" --push .
  rules:
    - if: $CI_COMMIT_TAG
      when: always
    - if: $CI_PIPELINE_SOURCE == "push"
      when: manual
    - when: never

diff-dev:
  stage: diff
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      export DEPLOY_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      export OWNER="${OWNER:-$CI_PROJECT_NAMESPACE}"
      echo "helmfile diff (env=dev) -> image=${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG} owner=${OWNER} ts=${DEPLOY_TIMESTAMP}"
    - helmfile -f helmfile.yaml.gotmpl -e dev -l env=dev diff

diff-prod:
  stage: diff
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      export DEPLOY_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      export OWNER="${OWNER:-$CI_PROJECT_NAMESPACE}"
      echo "helmfile diff (env=prod) -> image=${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG} owner=${OWNER} ts=${DEPLOY_TIMESTAMP}"
    - helmfile -f helmfile.yaml.gotmpl -e prod -l env=prod diff

deploy-dev:
  stage: deploy
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest
  when: manual
  allow_failure: false
  environment:
    name: dev
  before_script:
    - |
      if [ -z "$KUBECONFIG" ] || [ ! -f "$KUBECONFIG" ]; then
        echo "ERROR: KUBECONFIG file variable is not set or file not found. Add CI variable KUBECONFIG (File) with kubeconfig for the 'ci' ServiceAccount."
        exit 1
      fi
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      export DEPLOY_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      export OWNER="${OWNER:-$CI_PROJECT_NAMESPACE}"
      echo "Deploying env=dev image=${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG} owner=${OWNER} ts=${DEPLOY_TIMESTAMP}"
    - helmfile -f helmfile.yaml.gotmpl -e dev -l env=dev apply

deploy-prod:
  stage: deploy
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest
  when: manual
  allow_failure: false
  environment:
    name: prod
  before_script:
    - |
      if [ -z "$KUBECONFIG" ] || [ ! -f "$KUBECONFIG" ]; then
        echo "ERROR: KUBECONFIG file variable is not set or file not found. Add CI variable KUBECONFIG (File) with kubeconfig for the 'ci' ServiceAccount."
        exit 1
      fi
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        export IMAGE_TAG="$CI_COMMIT_TAG"
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
      else
        export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"
      fi
      export DEPLOY_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      export OWNER="${OWNER:-$CI_PROJECT_NAMESPACE}"
      echo "Deploying env=prod image=${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG} owner=${OWNER} ts=${DEPLOY_TIMESTAMP}"
    - helmfile -f helmfile.yaml.gotmpl -e prod -l env=prod apply

test-ci:
  stage: test
  image: registry.csc.sibsutis.ru/csc-public/internal-container-images/k8s-tools:latest

  before_script:
    - apk add docker

  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then export IMAGE_TAG="$CI_COMMIT_TAG"; fi
      if [ -n "$CI_COMMIT_SHORT_SHA" ]; then export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"; fi
      if [ -z "$IMAGE_TAG" ]; then export IMAGE_TAG="$(echo "$CI_COMMIT_REF_NAME" | tr '/' '-')"; fi
      echo "IMAGE_TAG=$IMAGE_TAG"
      echo "$HAWK_REGISTRY_PASSWORD" | docker login "$HAWK_REGISTRY" -u "$HAWK_REGISTRY_USER" --password-stdin
      docker manifest inspect "${HAWK_REGISTRY_IMAGE}:${IMAGE_TAG}" > /dev/null
      helmfile -f helmfile.yaml.gotmpl -e dev -l env=dev diff
      helmfile -f helmfile.yaml.gotmpl -e prod -l env=prod diff
      helmfile -f helmfile.yaml.gotmpl -e dev -l env=dev template > dev.yaml
      helmfile -f helmfile.yaml.gotmpl -e prod -l env=prod template > prod.yaml
    - kubectl apply -f k8s/rbac.yaml
    - |
      echo "===== DEBUG: pods in namespace ====="
      kubectl get pod -n iv222 -o wide || true

      echo "===== DEBUG: RBAC check ====="
      kubectl auth can-i list pods -n iv222 || true
      kubectl auth can-i create pods/portforward -n iv222 || true

      echo "===== DEBUG: pick app-dev pod ====="
      POD="$(kubectl get pod -n iv222 -l app.kubernetes.io/instance=app-dev -o jsonpath='{.items[0].metadata.name}')"
      echo "POD=$POD"

      echo "===== DEBUG: describe pod ====="
      kubectl describe pod -n iv222 "$POD" || true

      echo "===== DEBUG: previous logs ====="
      kubectl logs -n iv222 "$POD" --previous || true

      echo "===== DEBUG: current logs ====="
      kubectl logs -n iv222 "$POD" || true

      echo "===== DEBUG: serviceaccount files ====="
      kubectl exec -n iv222 "$POD" -- sh -c 'ls -la /var/run/secrets/kubernetes.io/serviceaccount/ || true' || true

      echo "===== DEBUG: k8s env inside pod ====="
      kubectl exec -n iv222 "$POD" -- sh -c 'env | grep KUBERNETES || true' || true
    - |
      grep -q "kind: ServiceAccount" dev.yaml || { echo "ServiceAccount отсутствует"; exit 1; }
      awk '
        /^kind: Role$/ { in_role=1 }
        in_role { print }
        /^---$/ && in_role { exit }
      ' dev.yaml | grep -q "pods" || { echo "Role для pods отсутствует"; exit 1; }
      awk '
        /^kind: RoleBinding$/ { in_rb=1 }
        in_rb { print }
        /^---$/ && in_rb { exit }
      ' dev.yaml | grep -q "ServiceAccount" || { echo "RoleBinding отсутствует"; exit 1; }
      awk '
        /^kind: Deployment$/ { in_dep=1 }
        in_dep { print }
        /^---$/ && in_dep { exit }
      ' dev.yaml | grep -q "serviceAccountName:" || { echo "Deployment не использует ServiceAccount"; exit 1; }
      grep -q "kind: Middleware" dev.yaml || { echo "Middleware отсутствует"; exit 1; }
      grep -q "kind: VerticalPodAutoscaler" dev.yaml || { echo "VPA отсутствует"; exit 1; }
      kubectl get pod -n iv222
      kubectl port-forward -n iv222 svc/app-dev-hawk-chart 8080:8080 &
      PORT_FORWARD_PID=$!
      sleep 60
      RESPONSE=$(curl -s --max-time 20 http://127.0.0.1:8080/)
      echo "$RESPONSE"
      echo "$RESPONSE" | grep -q '"running_pods":' || { kill $PORT_FORWARD_PID; exit 1; }
      kill $PORT_FORWARD_PID
      RESPONSE_PARTNER=$(curl -s --max-time 30 http://127.0.0.1:8080/partner)
      echo "Partner response: $RESPONSE_PARTNER"
      kill $PORT_FORWARD_PID 2>/dev/null || true
#      echo "$RESPONSE_PARTNER" | grep -q '"status": "success"' || {
#        kill $PORT_FORWARD_PID 2>/dev/null || true
#        exit 1
#      }
#      echo "$RESPONSE_PARTNER" | grep -q '"partner_data"' || {
#        echo "В /partner нет partner_data"
#      }