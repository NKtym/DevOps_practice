# Source: hawk-chart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-dev-hawk-chart
  labels:
    helm.sh/chart: hawk-chart-0.1.0
    app.kubernetes.io/name: hawk-chart
    app.kubernetes.io/instance: app-dev
    app.kubernetes.io/version: "1.16.0"
    app.kubernetes.io/managed-by: Helm
    owner: iv222
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hawk-chart
      app.kubernetes.io/instance: app-dev
  template:
    metadata:
      labels:
        helm.sh/chart: hawk-chart-0.1.0
        app.kubernetes.io/name: hawk-chart
        app.kubernetes.io/instance: app-dev
        app.kubernetes.io/version: "1.16.0"
        app.kubernetes.io/managed-by: Helm
        owner: iv222
    spec:
      serviceAccountName: app-dev-hawk-chart
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: hawk-chart
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            runAsNonRoot: true
            runAsUser: 1000
          image: ":1.16.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            limits:
              cpu: 100m
              memory: 32Mi
            requests:
              cpu: 50m
              memory: 16Mi
