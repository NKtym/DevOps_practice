{{- if .Values.middleware.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "hawk-chart.fullname" . }}-headers
  labels:
    {{- include "hawk-chart.labels" . | nindent 4 }}
spec:
  headers:
    customResponseHeaders:
      X-Owner: {{ .Values.owner | quote }}
      X-App-Name: {{ include "hawk-chart.fullname" . | quote }}
{{- end }}