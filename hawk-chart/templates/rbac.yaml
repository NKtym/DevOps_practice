apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-pod-access
  namespace: iv222
  labels:
    owner: iv222
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-pod-access-binding
  namespace: iv222
  labels:
    owner: iv222
subjects:
  - kind: ServiceAccount
    name: ci
    namespace: iv222
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-pod-access