{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ci-portforward
  namespace: iv222
  labels:
    owner: iv222
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/portforward
    verbs:
      - get
      - list
      - watch
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-portforward
  namespace: iv222
  labels:
    owner: iv222
subjects:
  - kind: ServiceAccount
    name: ci
    namespace: iv222
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ci-portforward
{{- end }}