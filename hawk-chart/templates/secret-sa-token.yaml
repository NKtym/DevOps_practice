{{- if and .Values.serviceAccount.create .Values.serviceAccount.tokenSecret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-token" (include "hawk-chart.serviceAccountName" .)) .Values.serviceAccount.tokenSecret.name }}
  annotations:
    kubernetes.io/service-account.name: {{ include "hawk-chart.serviceAccountName" . }}
type: kubernetes.io/service-account-token
{{- end }}