{{- $tokenSecret := .Values.serviceAccount.tokenSecret | default dict }}
{{- if and .Values.serviceAccount.create (default true $tokenSecret.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default (printf "%s-token" (include "hawk-chart.serviceAccountName" .)) $tokenSecret.name }}
  labels:
    {{- include "hawk-chart.labels" . | nindent 4 }}
  annotations:
    kubernetes.io/service-account.name: {{ include "hawk-chart.serviceAccountName" . }}
type: kubernetes.io/service-account-token
{{- end }}