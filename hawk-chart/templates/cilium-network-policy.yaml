{{- if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "hawk-chart.fullname" . }}
  labels:
    {{- include "hawk-chart.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "hawk-chart.selectorLabels" . | nindent 6 }}
  {{- if .Values.ciliumNetworkPolicy.ingressFromEntities }}
  ingress:
    - fromEntities:
      {{- toYaml .Values.ciliumNetworkPolicy.ingressFromEntities | nindent 8 }}
  {{- end }}
  
  {{- if .Values.ciliumNetworkPolicy.egressToExternalApps }}
  egress:
    {{- range .Values.ciliumNetworkPolicy.egressToExternalApps }}
    - toEndpoints:
      - matchLabels:
          app.kubernetes.io/instance: {{ .podSelector.app.kubernetes.io/instance | quote }}
        matchExpressions:
        - key: io.kubernetes.pod.namespace
          operator: In
          values: [ "{{ .namespace }}" ]
      toPorts:
      - ports:
        - port: "8080"
          protocol: TCP
    {{- end }}
  {{- end }}
{{- end }}