{{- if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "hawk-chart.fullname" . }}
  labels:
    {{- include "hawk-chart.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "hawk-chart.selectorLabels" . | nindent 6 }}

  ingress:
    - fromEntities:
      - cluster
    - fromEndpoints:
      - matchLabels:
          app.kubernetes.io/instance: is241s07-dev
        namespace:
          matchName: is241
      toPorts:
      - ports:
        - port: "8080"
          protocol: TCP


  egress:
    - toEntities:
      - cluster
    {{- range .Values.ciliumNetworkPolicy.egressToExternalApps }}
    - toEndpoints:
      - matchLabels:
          app.kubernetes.io/instance: {{ .serviceName | quote }}
        namespace:
          matchName: {{ .namespace }}
      toPorts:
      - ports:
        - port: "8080"
          protocol: TCP
    {{- end }}
{{- end }}