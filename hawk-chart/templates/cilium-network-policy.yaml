{{- if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "hawk-chart.fullname" . }}
  labels:
    {{- include "hawk-chart.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "hawk-chart.selectorLabels" . | nindent 6 }}

  ingress:
    {{- if .Values.ciliumNetworkPolicy.allowCluster }}
    - fromEntities:
      - cluster
    {{- end }}
    {{- range .Values.ciliumNetworkPolicy.peers }}
    - fromEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: {{ .namespace | quote }}
          app.kubernetes.io/instance: {{ .instance | quote }}
      toPorts:
      - ports:
        - port: {{ $.Values.service.port | quote }}
          protocol: TCP
    {{- end }}

  egress:
    {{- if .Values.ciliumNetworkPolicy.allowCluster }}
    - toEntities:
      - cluster
    {{- end }}
    {{- range .Values.ciliumNetworkPolicy.peers }}
    - toEndpoints:
      - matchLabels:
          k8s:io.kubernetes.pod.namespace: {{ .namespace | quote }}
          app.kubernetes.io/instance: {{ .instance | quote }}
      toPorts:
      - ports:
        - port: {{ $.Values.service.port | quote }}
          protocol: TCP
    {{- end }}
{{- end }}