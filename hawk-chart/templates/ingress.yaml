{{- if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "hawk-chart.fullname" . }}
  labels:
    {{- include "hawk-chart.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "hawk-chart.selectorLabels" . | nindent 6 }}

  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: app-dev-hawk-chart
            k8s:io.kubernetes.pod.namespace: is241
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

  {{- if .Values.ciliumNetworkPolicy.egressToExternalApps }}
  egress:
    {{- range .Values.ciliumNetworkPolicy.egressToExternalApps }}
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/instance: {{ .serviceName | quote }}
            k8s:io.kubernetes.pod.namespace: {{ .namespace | quote }}
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    {{- end }}
  {{- end }}
{{- end }}