owner: "iv222"
replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
  tokenSecret:
    enabled: true
    name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: 
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext: 
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "hawk-dev"
  annotations: {}
  hosts:
    - host: "iv222s03.hawk.csc.sibsutis.ru"
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

resources: 
  requests:
    memory: "16Mi"
    cpu: "50m"
  limits:
    cpu: "100m"
    memory: "32Mi"

livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

kind: Deployment

deployTimestamp: ""

middleware:
  enabled: true
  spec:
    ipAllowList:
      sourceRange:
        - "81.19.141.18/32"

vpa:
  enabled: true
  updateMode: Auto

externalAppUrl: ""

ciliumNetworkPolicy:
  enabled: true
  ingressFromEntities:
    - cluster
  egressToEntities:
    - cluster
  egressToExternalApps:
    - serviceName: "is241s07-dev"
      namespace: "is241"
      podSelector:
        app.kubernetes.io/instance: "is241s07-dev"
    - serviceName: "is241s07-prod"
      namespace: "is241"
      podSelector:
        app.kubernetes.io/instance: "is241s07-prod"

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["list"]