owner: "iv222"
replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
  tokenSecret:
    enabled: true
    name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: "hawk-dev"
  annotations: {}
  hosts: []
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

resources:
  requests:
    memory: "16Mi"
    cpu: "50m"
  limits:
    cpu: "100m"
    memory: "32Mi"

livenessProbe:
  httpGet:
    path: /health
    port: http

readinessProbe:
  httpGet:
    path: /health
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

kind: Deployment
deployTimestamp: ""

middleware:
  enabled: true
  spec:
    headers:
      customResponseHeaders:
        X-Owner: "iv222"
        X-App-Name: "hawk-chart"

vpa:
  enabled: true
  updateMode: "Off"

ciliumNetworkPolicy:
  enabled: true
  allowCluster: false
  peers: 
    - namespace: is241
      instance: is241s07-dev
    - namespace: is241
      instance: is241s07-prod

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["list"]

externalAppUrl: ""

env: []