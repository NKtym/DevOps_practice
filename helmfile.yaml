environments:
  dev:
    values:
      - environments/common.env.yaml
      - environments/dev/env.yaml
  prod:
    values:
      - environments/common.env.yaml
      - environments/prod/env.yaml

---

repositories:
  - name: local
    url: file://./hawk-chart

releases:
  - name: app-dev
    namespace: iv222                     # укажите ваше namespace
    chart: ./hawk-chart
    labels:
      env: dev
    values:
      # НЕ указываем ./hawk-chart/values.yaml здесь
      - image:
          repository: {{ env "HAWK_REGISTRY_IMAGE" }}
          tag: {{ env "IMAGE_TAG" }}
      - replicaCount: {{ default .Environment.Values.REPLICA_COUNT 1 }}
      - owner: {{ default .Environment.Values.APP_OWNER "" }}
      - deployTimestamp: {{ default .Environment.Values.DEPLOY_TIMESTAMP "" }}
      - ingress:
          enabled: true
          className: hawk-dev
          hosts:
            - host: "{{ printf \"%s.%s\" .Environment.Values.HOST_NAME .Environment.Values.HOST_BASE }}"
  # Prod release
  - name: app-prod
    namespace: iv222
    chart: ./hawk-chart
    labels:
      env: prod
    values:
      - image:
          repository: {{ env "HAWK_REGISTRY_IMAGE" }}
          tag: {{ env "IMAGE_TAG" }}
      - replicaCount: {{ default .Environment.Values.REPLICA_COUNT 1 }}
      - owner: {{ default .Environment.Values.APP_OWNER "" }}
      - deployTimestamp: {{ default .Environment.Values.DEPLOY_TIMESTAMP "" }}
      - ingress:
          enabled: true
          className: hawk-dev
          hosts:
            - host: "{{ printf \"%s.%s\" .Environment.Values.HOST_NAME .Environment.Values.HOST_BASE }}"